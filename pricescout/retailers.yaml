  # ------------------------------------------------- Rohlik Group platform
  # One codebase serving five markets; the same search-metadata endpoint
  # returns pack size and retailer-computed price-per-unit in every country.

  - name: Rohlik
    country: CZ
    currency: CZK
    adapter: json
    search_url: "https://www.rohlik.cz/services/frontend-service/search-metadata?search={query}&companyId=1"
    json:
      items: "data.productList"
      name: "productName"
      price: "price.full"
      size: "textualAmount"
      unit_price_value: "pricePerUnit.full"
      unit_price_unit: "unit"
      url: "baseLink"
      url_prefix: "https://www.rohlik.cz/"

