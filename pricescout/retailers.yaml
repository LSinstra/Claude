# European grocery retailer registry.
#
# adapter:  which extraction strategy to use (see pricescout/adapters/)
# currency: ISO code used when the page does not state one
# enabled:  set false to skip without deleting the entry
#
# Adding a JSON retailer needs no Python -- give it adapter: json and a `json:`
# field map. Adding an HTML retailer usually needs nothing but a search_url,
# because the generic adapter discovers cards adaptively.

retailers:
  # ---------------------------------------------------------------- Benelux
  - name: Albert Heijn
    country: NL
    currency: EUR
    adapter: ah
    search_url: "https://www.ah.nl/zoeken?query={query}"

