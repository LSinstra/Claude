# Search terms per market. Each retailer is queried with the term list for its
# country, falling back to `default`. Keeping terms native-language matters:
# searching "oat milk" on a German site returns nothing useful.

default:
  - tofu
  - tempeh
  - vegan burger
  - oat milk
  - vegan cheese

